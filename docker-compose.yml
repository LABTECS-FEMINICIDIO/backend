version: "3.7"

services:
  api_backend_feminicidio:
    container_name: api_backend_feminicidio_rio_branco
    image: api_feminicidio_rio_branco
    build:
      dockerfile: ./Dockerfile
      context: ./
    restart: unless-stopped
    ports:
      - ${PORT_BACKEND}:${PORT_BACKEND}
    env_file: .env
    environment:
      - TZ=America/Manaus